name: Terraform checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4

      - name: Check formatting
        run: terraform fmt -check -diff -recursive

      - name: Initialize providers and modules
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Initialize Kubernetes configuration
        working-directory: environments/kubernetes
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate Kubernetes configuration
        working-directory: environments/kubernetes
        run: terraform validate -no-color

      - name: Initialize Cloudflare retirement configuration
        working-directory: environments/cloudflare
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate Cloudflare retirement configuration
        working-directory: environments/cloudflare
        run: terraform validate -no-color

      - name: Test controller IAM policy without credentials
        working-directory: modules/aws_load_balancer_controller_policy
        run: |
          cp ../../environments/kubernetes/.terraform.lock.hcl .terraform.lock.hcl
          terraform init -backend=false -input=false -lockfile=readonly
          terraform test -no-color

      - name: Initialize public endpoint configuration
        working-directory: environments/public_endpoint
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate public endpoint configuration
        working-directory: environments/public_endpoint
        run: terraform validate -no-color

      - name: Test certificate DNS validation without credentials
        working-directory: modules/acm_dns_certificate
        run: |
          cp ../../environments/public_endpoint/.terraform.lock.hcl .terraform.lock.hcl
          terraform init -backend=false -input=false -lockfile=readonly
          terraform test -no-color
